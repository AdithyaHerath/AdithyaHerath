<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Koi Pond Demo</title>
<style>
  :root { --bg:#010409; --card:#0d1117; --line:#30363d; --text:#e6edf3; --muted:#8b949e; --green:#3fb950; --gold:#e3b341; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
  main { max-width: 900px; margin: 0 auto; padding: 28px 16px 60px; }
  h1 { font-size: 26px; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 22px; }
  #pond svg { width: 100%; height: auto; display: block; }
  .controls { margin: 18px 0 8px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  input[type=range] { flex: 1; min-width: 200px; accent-color: var(--green); }
  input[type=number] { width: 110px; background: #010409; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font: inherit; }
  button { background: #21262d; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button.primary { background: #238636; border-color: #2ea043; }
  button.on { border-color: var(--green); color: #7ee787; }
  .stages { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .stages button { font-size: 12px; padding: 4px 10px; }
  table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; }
  tr.cur td { color: #7ee787; }
  @media (max-width: 600px) { table { font-size: 12px; } th, td { padding: 6px; } }
</style>
</head>
<body>
<main>
  <h1>🎏 Koi Pond — demo</h1>
  <p class="sub">Drag the slider to see how the pond changes as contributions grow. It uses the same renderer as the GitHub Action that updates your README.</p>

  <div id="pond"></div>

  <div class="controls">
    <div class="row">
      <input id="slider" type="range" min="0" max="1000" value="0" aria-label="Contributions">
      <input id="num" type="number" min="0" max="9999" value="1268" aria-label="Contributions number">
      <button id="play" class="primary">▶ Watch it grow</button>
    </div>
    <div class="stages" id="stages"></div>
  </div>

  <table>
    <thead><tr><th>Milestone</th><th>Stage</th><th>What happens in the pond</th></tr></thead>
    <tbody id="table"></tbody>
  </table>
</main>
<script src="render.js"></script>
<script>
  const { renderPond, stageFor, fakeWeeks, STAGES } = KoiPond;
  const MAX = 6000;
  const pond = document.getElementById('pond'), slider = document.getElementById('slider'), num = document.getElementById('num');
  const toSlider = (n) => Math.round(Math.sqrt(n / MAX) * 1000);   // square-root scale: early stages get more room
  const fromSlider = (v) => Math.round((v / 1000) ** 2 * MAX);
  const t0 = performance.now();
  const weeksCache = {};

  let count = 1268, pending = false;
  function draw() {
    pending = false;
    const bucket = Math.round(count / 50);
    const weeks = weeksCache[bucket] || (weeksCache[bucket] = fakeWeeks(count, 42 + bucket));
    pond.innerHTML = renderPond({ user: 'AdithyaHerath', total: count, weeks, clock: (performance.now() - t0) / 1000 });
    const idx = stageFor(count).index;
    document.querySelectorAll('#stages button').forEach((b, k) => b.classList.toggle('on', k === idx));
    document.querySelectorAll('#table tr').forEach((r, k) => r.classList.toggle('cur', k === idx));
  }
  function set(n, from) {
    count = Math.max(0, Math.min(MAX, Math.round(n)));
    if (from !== 'slider') slider.value = toSlider(count);
    if (from !== 'num') num.value = count;
    if (!pending) { pending = true; requestAnimationFrame(draw); }
  }

  STAGES.forEach((s) => {
    const b = document.createElement('button');
    b.textContent = `${s.name} · ${s.min}`;
    b.onclick = () => { stop(); set(s.min); };
    document.getElementById('stages').appendChild(b);
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${s.min.toLocaleString()}+</td><td>${s.name}</td><td>${s.unlock}</td>`;
    document.getElementById('table').appendChild(tr);
  });

  slider.oninput = () => { stop(); set(fromSlider(+slider.value), 'slider'); };
  num.oninput = () => { stop(); set(+num.value || 0, 'num'); };

  let timer = null;
  const playBtn = document.getElementById('play');
  function stop() { if (timer) { clearInterval(timer); timer = null; playBtn.textContent = '▶ Watch it grow'; } }
  playBtn.onclick = () => {
    if (timer) return stop();
    let v = count >= MAX - 10 ? 0 : toSlider(count);
    playBtn.textContent = '⏸ Pause';
    timer = setInterval(() => {
      v += 4;
      if (v >= 1000) { v = 1000; stop(); }
      set(fromSlider(v));
    }, 90);
  };

  set(count);
</script>
</body>
</html>
